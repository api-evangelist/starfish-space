apis:
- name: Starfish Space Website Content API
  description: 'The public WordPress REST API served by Starfish Space at
    https://www.starfishspace.com/wp-json/wp/v2. It exposes the content behind starfishspace.com —
    news and press releases, pages (The Otter, Company, Missions, Careers, Contact), media,
    taxonomies, users, comments and search. Read operations are available anonymously; write
    operations require an authenticated WordPress user. This is a website content interface, not a
    spacecraft, telemetry or mission-data API.'
  humanURL: https://www.starfishspace.com/
  baseURL: https://www.starfishspace.com/wp-json/wp/v2
