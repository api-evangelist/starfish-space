- name: Starfish Space MCP Server
  description: 'A live Model Context Protocol (MCP) server exposed by Starfish Space at
    https://www.starfishspace.com/wp-json/mcp/mcp-oauth-server, served through the WordPress MCP
    adapter. Access is OAuth 2.1 protected: the site publishes RFC 8414 authorization-server
    metadata and RFC 9728 protected-resource metadata with a single `mcp` scope and PKCE (S256).
    Anonymous initialize / tools/list calls return HTTP 401 mcp_unauthorized, so the live tool
    inventory could not be introspected without credentials.'
  humanURL: https://www.starfishspace.com/
  baseURL: https://www.starfishspace.com/wp-json/mcp/mcp-oauth-server
