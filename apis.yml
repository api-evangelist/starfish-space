aid: starfish-space
name: Starfish Space
description: 'Starfish Space is a satellite-servicing company founded in 2019 by Trevor Bennett
  and Austin Link and headquartered in the Seattle, Washington area (Tukwila). It builds Otter,
  a small, low-cost, electrically propelled servicing vehicle that performs autonomous rendezvous,
  proximity operations and docking (RPOD) with satellites that were never designed to be serviced —
  extending their life, relocating them, or disposing of them at end of mission. Its Otter Pup
  demonstration missions target the first-ever commercial satellite docking in low Earth orbit, and
  the company has been awarded a $54.5M U.S. Space Force contract for a dedicated Otter servicing
  vehicle. Starfish Space publishes no developer product API; the machine-readable surface catalogued
  here is the public WordPress REST API and the OAuth-protected Model Context Protocol (MCP) server
  served from starfishspace.com.'
