components:
  schemas:
    RestError:
      title: rest-error
      type: object
      description: WordPress REST API error envelope, as returned by this API.
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code.
    Comment:
      $schema: http://json-schema.org/draft-04/schema#
      title: comment
      type: object
      properties:
        id:
          description: Unique identifier for the comment.
          type: integer
          context:
          - view
          - edit
          - embed
          readonly: true
        author:
          description: The ID of the user object, if author was a user.
          type: integer
          context:
          - view
          - edit
          - embed
        author_email:
          description: Email address for the comment author.
          type: string
          format: email
          context:
          - edit
        author_ip:
          description: IP address for the comment author.
          type: string
          format: ip
          context:
          - edit
        author_name:
          description: Display name for the comment author.
          type: string
          context:
          - view
          - edit
          - embed
        author_url:
          description: URL for the comment author.
          type: string
          format: uri
          context:
          - view
          - edit
          - embed
        author_user_agent:
          description: User agent for the comment author.
          type: string
          context:
          - edit
        content:
          description: The content for the comment.
          type: object
          context:
          - view
          - edit
          - embed
          properties:
            raw:
              description: Content for the comment, as it exists in the database.
              type: string
              context:
              - edit
            rendered:
              description: HTML content for the comment, transformed for display.
              type: string
              context:
              - view
              - edit
              - embed
              readonly: true
        date:
          description: The date the comment was published, in the site's timezone.
          type: string
          format: date-time
          context:
          - view
          - edit
          - embed
        date_gmt:
          description: The date the comment was published, as GMT.
          type: string
          format: date-time
          context:
          - view
          - edit
        link:
          description: URL to the comment.
          type: string
          format: uri
          context:
          - view
          - edit
          - embed
          readonly: true
        parent:
          description: The ID for the parent of the comment.
          type: integer
          context:
          - view
          - edit
          - embed
          default: 0
        post:
          description: The ID of the associated post object.
          type: integer
          context:
          - view
          - edit
          default: 0
        status:
          description: State of the comment.
          type: string
          context:
          - view
          - edit
        type:
          description: Type of the comment.
          type: string
          context:
          - view
          - edit
          - embed
          readonly: true
          default: comment
        meta:
          description: Meta fields.
          type: object
          context:
          - view
          - edit
          properties:
            _wp_note_status:
              type: string
              title: ''
              description: Note resolution status
              default: ''
              enum:
              - resolved
              - reopen
        acf:
          description: ACF field data
          type: object
          properties: []
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: WordPress application password (username + application password).
    cookieNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: WordPress cookie authentication nonce, for same-origin requests.
