                  type: string
                  description: The type of object originally represented, such as "category", "post",
                    or "attachment".
                object_id:
                  default: 0
                  type: integer
                  minimum: 0
                  description: The database ID of the original object this menu item represents, for example
                    the ID for posts or the term_id for categories.
                target:
                  type: string
                  enum:
